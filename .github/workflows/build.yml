name: Build & Test

on: [push, pull_request]

jobs:
  build:

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
        java: [ 11, 17, 21, 25, 27 ]
        distribution: [ 'temurin' ]
        include:
          - os: windows-latest
            java: '8'
            distribution: 'zulu'
          - os: ubuntu-latest
            java: '8'
            distribution: 'zulu'
          - os: macos-latest
            java: '8'
            distribution: 'zulu'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          allow-unsafe-pr-checkout: false

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: ${{ matrix.distribution }}
          java-version: 25
          cache: 'maven'

      - name: Build
        run: |
          ./mvnw -version
          ./mvnw -B --color always install -DskipTests

      - name: Javadoc
        run: ./mvnw -B --color always javadoc:javadoc

      - name: Set up JDK ${{matrix.java}}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Test
        run: |
          ./mvnw -version
          ./mvnw -B --color always verify
