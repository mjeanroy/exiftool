name: Release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: "Release version (X.Y.Z)"
        required: true
      developmentVersion:
        description: "Snapshot version (X.Y.Z without -SNAPSHOT suffix)"
        required: true
      dry_run:
        description: Run dry-run release
        required: true
        type: choice
        default: 'true'
        options:
          - 'true'
          - 'false'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          allow-unsafe-pr-checkout: false

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v6.1.0
        with:
          gpg_private_key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: 25
          distribution: 'temurin'
          cache: 'maven'
          check-latest: true

          # ID of the distributionManagement repository in the pom.xml file.
          server-id: 'central'

          # Environment variable name for the username for authentication to the Apache Maven repository.
          server-username: MAVEN_USERNAME

          # Environment variable name for password or token for authentication to the Apache Maven repository.
          server-password: MAVEN_PASSWORD

          # GPG private key to import. Default is empty string.
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}

          # Environment variable name for the GPG private key passphrase.
          gpg-passphrase: GPG_PASSPHRASE

      - name: Configure Git
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_GIT_SIGNING_KEY }}" > ~/.ssh/signing_key
          chmod 600 ~/.ssh/signing_key
          ssh-keygen -y -f ~/.ssh/signing_key > ~/.ssh/signing_key.pub

          git config --global gpg.format ssh
          git config --global user.signingkey ~/.ssh/signing_key.pub
          git config --global commit.gpgsign true
          git config --global tag.gpgSign true
          git config user.email "mickael.jeanroy@gmail.com"
          git config user.name "Mickael Jeanroy"

      - name: Release
        run: |
          ./mvnw -B --color always -U \
            "release:prepare" \
            "release:perform" \
            "-DdryRun=${DRY_RUN}" \
            "-DreleaseVersion=${RELEASE_VERSION}" \
            "-DdevelopmentVersion=${DEVELOPMENT_VERSION}-SNAPSHOT"
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_VERSION: ${{ github.event.inputs.releaseVersion }}
          DEVELOPMENT_VERSION: ${{ github.event.inputs.developmentVersion }}
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}